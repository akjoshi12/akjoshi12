<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="Atri Joshi, Data and AI Engineer in Toronto">
  <defs>
    <clipPath id="c"><rect width="1000" height="240" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1000" height="240" fill="#0B0D0E"/>
    <rect x="0.5" y="0.5" width="999" height="239" rx="16" fill="none" stroke="#262B2F"/>
    </g>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="508.4" y="93.4" text-anchor="middle" font-size="54" font-weight="700" letter-spacing="3" fill="#000" opacity="0.35">Atri Joshi</text>
    <text x="505.4" y="89.4" text-anchor="middle" font-size="54" font-weight="700" letter-spacing="3" fill="#0f4a2a">Atri Joshi</text>
    <text x="504.5" y="88.5" text-anchor="middle" font-size="54" font-weight="700" letter-spacing="3" fill="#145932">Atri Joshi</text>
    <text x="503.6" y="87.6" text-anchor="middle" font-size="54" font-weight="700" letter-spacing="3" fill="#19693a">Atri Joshi</text>
    <text x="502.7" y="86.7" text-anchor="middle" font-size="54" font-weight="700" letter-spacing="3" fill="#1f7942">Atri Joshi</text>
    <text x="501.8" y="85.8" text-anchor="middle" font-size="54" font-weight="700" letter-spacing="3" fill="#24884a">Atri Joshi</text>
    <text x="500.9" y="84.9" text-anchor="middle" font-size="54" font-weight="700" letter-spacing="3" fill="#299852">Atri Joshi</text>
    <text x="500" y="84" text-anchor="middle" font-size="54" font-weight="700" letter-spacing="3" fill="#E7EAEC">Atri Joshi</text>
    <text x="500" y="122" text-anchor="middle" font-size="18" letter-spacing="3" fill="#9AA3AB">DATA &amp; AI ENGINEER · TORONTO</text>
  <rect x="440" y="134" width="120" height="2" rx="1" fill="#262B2F"/>
    <rect x="440" y="134" width="40" height="2" rx="1" fill="#4ADE80"><animate attributeName="x" values="440;520;440" dur="4s" repeatCount="indefinite"/></rect>
    <text x="500" y="168" text-anchor="middle" font-size="22" fill="#E7EAEC" opacity="0">I build data pipelines and LLM systems.
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.04;0.21;0.25;1" values="0;1;1;0;0"/>
  </text>
  <text x="500" y="168" text-anchor="middle" font-size="22" fill="#E7EAEC" opacity="0">Then I measure whether they actually work.
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.25;0.29;0.46;0.5;1" values="0;0;1;1;0;0"/>
  </text>
  <text x="500" y="168" text-anchor="middle" font-size="22" fill="#E7EAEC" opacity="0">Local-first. Test-gated. No invented facts.
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.5;0.54;0.71;0.75;1" values="0;0;1;1;0;0"/>
  </text>
  <text x="500" y="168" text-anchor="middle" font-size="22" fill="#E7EAEC" opacity="0">97.6% word fidelity · 53× error caught · 8-engineer team led
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.75;0.79;0.96;1.0" values="0;0;1;1;0"/>
  </text>
    <g transform="translate(500 212)">
      <circle cx="-62" cy="0" r="5" fill="#4ADE80"><animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/></circle>
      <text x="-48" y="5" font-size="14" fill="#4ADE80">Open to roles</text>
    </g>
  </g>
</svg>
