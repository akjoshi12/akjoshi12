<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="Atri Joshi, Data and AI Engineer in Toronto">
  <defs>
    <clipPath id="c"><rect width="1000" height="240" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1000" height="240" fill="#2f5bea"/>
    </g>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="512" y="96.0" text-anchor="middle" font-size="56" font-weight="800" fill="#000" opacity="0.18">Atri Joshi</text>
    <text x="509.6" y="91.6" text-anchor="middle" font-size="56" font-weight="800" fill="#0c1c5a">Atri Joshi</text>
